<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethiopia in faces</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #aea6a0;
    color: #20292F;
    font-family: "Inter", "Helvetica Neue", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 24px;
    min-height: 100vh;
  }

  .row {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    max-width: 100%;
  }
  .rect {
    width: 52px;
    height: 52px;
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    border: 0;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .rect:hover { transform: translateY(-2px); }
  .rect.active {
    box-shadow: 4px 4px 0 0 #6b6b6b;
    transform: translateY(-2px);
  }
  .spacer {
    width: 52px;
    height: 52px;
  }

  /* ====== Pair view (adapted from between-incidents) ====== */
  .pair-stage {
    width: 100%;
    max-width: 1600px;
    flex: 1 1 auto;
    min-height: 0;
    display: none;
    grid-template-columns: 1fr 1fr;
    padding: 16px 32px;
    align-items: center;
    justify-items: center;
  }
  .pair-stage.active { display: grid; animation: viewFadeIn 0.45s ease both; }
  @keyframes viewFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .frame-box {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    background: transparent;
    transition: transform 0.35s ease;
  }
  .pair-stage.mixed .frame-box.landscape {
    align-items: flex-end;
  }
  #frame-a {
    transform: translate(var(--shift-a-x, 0px), var(--shift-a-y, 0px));
  }
  #frame-b {
    transform: translate(var(--shift-b-x, 0px), var(--shift-b-y, 0px));
  }
  .frame-box img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .frame-box img.loaded { opacity: 1; }
  .frame-box { overflow: visible; }

  .nav-triangle {
    width: 0;
    height: 0;
    border-left: 26px solid transparent;
    border-right: 26px solid transparent;
    border-bottom: 52px solid transparent;
    background: none;
    padding: 0;
    border-top: 0;
    cursor: pointer;
    visibility: hidden;
    transition: transform 0.18s ease;
  }
  .nav-triangle.visible { visibility: visible; }
  .nav-triangle:hover { transform: translateY(-3px); }
</style>
</head>
<body>

<div class="row" id="btn-row">
  <button class="rect" style="background:#1b4b1f" data-folder="4">E</button>
  <button class="rect" style="background:#1f5824" data-folder="6">t</button>
  <button class="rect" style="background:#236428" data-folder="1">h</button>
  <button class="rect" style="background:#27702d" data-folder="14">i</button>
  <button class="rect" style="background:#2c7c32" data-folder="13">o</button>
  <button class="rect" style="background:#308837" data-folder="12">p</button>
  <button class="rect" style="background:#34943c" data-folder="15">i</button>
  <button class="rect" style="background:#38a041" data-folder="7">a</button>
  <div class="spacer"></div>
  <button class="rect" style="background:#3dad46" data-folder="9">i</button>
  <button class="rect" style="background:#41b94b" data-folder="2">n</button>
  <div class="spacer"></div>
  <button class="rect" style="background:#4ac054" data-folder="8">f</button>
  <button class="rect" style="background:#57c460" data-folder="3">a</button>
  <button class="rect" style="background:#63c86b" data-folder="5">c</button>
  <button class="rect" style="background:#6fcc77" data-folder="10">e</button>
  <button class="rect" style="background:#7bd182" data-folder="11">s</button>
</div>

<section class="pair-stage" id="pair-stage">
  <div class="frame-box" id="frame-a"><img id="pair-a" alt="" decoding="async"></div>
  <div class="frame-box" id="frame-b"><img id="pair-b" alt="" decoding="async"></div>
</section>

<button class="nav-triangle" id="nav-triangle" aria-label="Harar colours 2026" title="Harar colours 2026"></button>

<script>
  const FOLDER_FILES = {
    1:  ["faces/1/DSC03100.jpg",   "faces/1/DSC03841.jpg"],
    2:  ["faces/2/DSC00783.jpg",   "faces/2/DSC01817.jpg"],
    3:  ["faces/3/DSC04973.jpg",   "faces/3/DSC05159.jpg"],
    4:  ["faces/4/DSC01936.jpg",   "faces/4/DSC03640.jpg"],
    5:  ["faces/5/DSC03688.jpg",   "faces/5/DSC03867.jpg"],
    6:  ["faces/6/DSC01959.jpg",   "faces/6/DSC09370.jpg"],
    7:  ["faces/7/DSC05032.jpg",   "faces/7/DSC05074.jpg"],
    8:  ["faces/8/DSC05207.jpg",   "faces/8/DSC07561.jpg"],
    9:  ["faces/9/DSC01927.jpg",   "faces/9/DSC01930.jpg"],
    10: ["faces/10/DSC01792.jpg",  "faces/10/DSC04912.jpg"],
    11: ["faces/11/DSC01962.jpg",  "faces/11/DSC06683.jpg"],
    12: ["faces/12/DSC04747.jpg",  "faces/12/DSC06826.jpg"],
    13: ["faces/13/DSC03975.jpg",  "faces/13/DSC04319.jpg"],
    14: ["faces/14/DSC09881.jpg",  "faces/14/DSC09979.jpg"],
    15: ["faces/15/DSC02370.jpg",  "faces/15/DSC02380.jpg"],
  };
  const enc = (p) => p.split("/").map(encodeURIComponent).join("/");

  const stage = document.getElementById("pair-stage");
  const lbA = document.getElementById("pair-a");
  const lbB = document.getElementById("pair-b");
  const fA  = document.getElementById("frame-a");
  const fB  = document.getElementById("frame-b");
  const buttons = document.querySelectorAll(".rect[data-folder]");
  const navTriangle = document.getElementById("nav-triangle");
  navTriangle.addEventListener("click", () => { window.location.href = "index.html"; });

  let _token = 0;
  function showFolder(folder, btn) {
    const files = FOLDER_FILES[folder];
    if (!files) return;
    buttons.forEach((b) => b.classList.toggle("active", b === btn));
    navTriangle.style.borderBottomColor = getComputedStyle(btn).backgroundColor;
    navTriangle.classList.add("visible");
    const token = ++_token;
    lbA.classList.remove("loaded");
    lbB.classList.remove("loaded");
    lbA.src = enc(files[0]);
    lbB.src = enc(files[1]);
    stage.classList.add("active");
    Promise.all([decodeImg(lbA), decodeImg(lbB)]).then(() => {
      if (token !== _token) return;
      fitPair();
      requestAnimationFrame(() => {
        if (token !== _token) return;
        lbA.classList.add("loaded");
        lbB.classList.add("loaded");
      });
    });
  }
  function decodeImg(img) {
    if (img.decode) return img.decode().catch(() => {});
    if (img.complete && img.naturalWidth) return Promise.resolve();
    return new Promise((r) => {
      img.addEventListener("load", r, { once: true });
      img.addEventListener("error", r, { once: true });
    });
  }
  const prefetched = new Set();
  function prefetchFolder(folder) {
    if (prefetched.has(folder)) return;
    prefetched.add(folder);
    const files = FOLDER_FILES[folder];
    if (!files) return;
    for (const f of files) new Image().src = enc(f);
  }
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => showFolder(btn.dataset.folder, btn));
    btn.addEventListener("pointerenter", () => prefetchFolder(btn.dataset.folder));
    btn.addEventListener("focus", () => prefetchFolder(btn.dataset.folder));
  });
  for (const img of [lbA, lbB]) {
    img.addEventListener("load", () => fitPair());
  }
  window.addEventListener("resize", fitPair);

  const FRAME_ASPECT = 4 / 3;
  const PORTRAIT_FACTOR = 1.13;
  const LANDSCAPE_FACTOR = 0.95;
  function fitPair() {
    if (!stage.classList.contains("active")) return;
    const rA = lbA.naturalWidth / lbA.naturalHeight;
    const rB = lbB.naturalWidth / lbB.naturalHeight;
    if (!rA || !rB) return;
    const cs = getComputedStyle(stage);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const halfW = (stage.clientWidth - padX) / 2;
    const btnRow = document.getElementById("btn-row");
    const reserved = btnRow.getBoundingClientRect().bottom + 40;
    const availH = Math.max(300, window.innerHeight - reserved - padY - 24);
    // narrow = portrait or square (image width <= frame width when height-fit)
    const aNarrow = rA <= 1;
    const bNarrow = rB <= 1;
    const mixed = aNarrow !== bNarrow;
    stage.classList.toggle("mixed", mixed);
    fA.classList.toggle("portrait",  aNarrow);
    fA.classList.toggle("landscape", !aNarrow);
    fB.classList.toggle("portrait",  bNarrow);
    fB.classList.toggle("landscape", !bNarrow);
    const boxW = Math.min(halfW, ((availH - 40) / PORTRAIT_FACTOR) * FRAME_ASPECT);
    const boxH = boxW / FRAME_ASPECT;
    // Landscape frame shifts down only when the narrow one is a strict
    // portrait (extends past the frame bottom via PORTRAIT_FACTOR). A
    // square stays inside the frame, so no downshift is needed.
    const narrowR = mixed ? (aNarrow ? rA : rB) : null;
    const narrowIsPortrait = narrowR != null && narrowR < 1;
    const landscapeShift = (mixed && narrowIsPortrait) ? ((PORTRAIT_FACTOR - 1) / 2) * boxH + 20 : 0;

    function widthOf(r) {
      if (r < 1) return boxH * PORTRAIT_FACTOR * r;              // portrait
      if (r === 1) return boxH * LANDSCAPE_FACTOR;               // square
      const wByHeight = boxH * LANDSCAPE_FACTOR * r;
      const wByWidth  = boxW * LANDSCAPE_FACTOR;
      return Math.min(wByHeight, wByWidth);
    }

    // Same fixed gap between the two images on every page, with the gap
    // itself (not the images' combined bounding box) centered on the page.
    const GAP = 42;
    const W = halfW * 2;
    const wA = widthOf(rA);
    const wB = widthOf(rB);
    const desiredCenterA = W / 2 - GAP / 2 - wA / 2;
    const desiredCenterB = W / 2 + GAP / 2 + wB / 2;
    const naturalCenterA = W / 4;
    const naturalCenterB = (3 * W) / 4;
    const shiftAX = desiredCenterA - naturalCenterA;
    const shiftBX = desiredCenterB - naturalCenterB;
    const shiftAY = (mixed && !aNarrow && narrowIsPortrait) ? landscapeShift : 0;
    const shiftBY = (mixed && !bNarrow && narrowIsPortrait) ? landscapeShift : 0;
    stage.style.setProperty("--shift-a-x", shiftAX + "px");
    stage.style.setProperty("--shift-a-y", shiftAY + "px");
    stage.style.setProperty("--shift-b-x", shiftBX + "px");
    stage.style.setProperty("--shift-b-y", shiftBY + "px");
    for (const f of [fA, fB]) {
      f.style.width  = boxW + "px";
      f.style.height = boxH + "px";
    }
    for (const img of [lbA, lbB]) {
      const r = img.naturalWidth / img.naturalHeight;
      if (!r) { img.style.maxWidth = ""; img.style.maxHeight = ""; continue; }
      if (r < 1) {
        // portrait — grow past frame
        img.style.maxHeight = (boxH * PORTRAIT_FACTOR) + "px";
        img.style.maxWidth  = (boxW * PORTRAIT_FACTOR) + "px";
      } else if (r === 1) {
        // square — fit inside frame, height-bounded so it stays narrow
        const side = boxH * LANDSCAPE_FACTOR;
        img.style.maxHeight = side + "px";
        img.style.maxWidth  = side + "px";
      } else {
        // landscape
        img.style.maxHeight = (boxH * LANDSCAPE_FACTOR) + "px";
        img.style.maxWidth  = (boxW * LANDSCAPE_FACTOR) + "px";
      }
    }
  }
</script>
</body>
</html>
